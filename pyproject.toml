[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "djtools"
version = "2.9.1-rc6"
authors = [
    {name = "Alex Richards", email = "alex.richards006@gmail.com"},
]
description = "DJ Tools is a library for managing a collection of music."
readme = {file = "README.md", content-type = "text/markdown"}
keywords = [
    "DJ",
    "Collections",
    "Rekordbox",
    "Playlists",
    "Spotify",
    "Reddit",
    "Audio", 
]
requires-python=">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Other/Nonlisted Topic"
]
dependencies = [
    "asyncpraw",
    "awscli",
    "beautifulsoup4",
    "fuzzywuzzy",
    "Jinja2",
    "lxml",
    "pydantic",
    "pydub",
    "pyperclip",
    "python-dateutil",
    "PyYAML",
    "requests",
    "spotify-tools>=0.0.1",
    "tqdm",
    "youtube-dl"
]

[project.urls]
"Repository" = "https://github.com/a-rich/DJ-tools"
"Documentation" = "https://a-rich.github.io/DJ-Tools"
"Documentation (dev)" = "https://a-rich.github.io/DJ-Tools-dev-docs"

[project.optional-dependencies]
accelerated = [
    "python-Levenshtein" 
]

[dependency-groups]
dev = [
    "aiohttp",
    "build",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings-python",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "semver",
    "tomli; python_version < '3.11'",
    "twine",
]

[project.scripts]
djtools = "djtools:main"

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/djtools"]

[tool.coverage.run]
source = ["src"]
omit = ["src/djtools/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover"
]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "G",      # flake8-logging-format
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
]
ignore = [
    "B905",     # zip-without-explicit-strict
    "E402",     # module-import-not-at-top-of-file
    "E501",     # line-too-long (let formatter handle it)
    "G002",     # logging-percent-format
    "G003",     # logging-string-concat
    "G004",     # logging-fstring-interpolation
    "N818",     # error-suffix-on-exception-name
    "PLC0415",  # import-outside-top-level
    "PLR0911",  # too-many-return-statements
    "PLR0917",  # too-many-positional-arguments
    "PLR2004",  # magic-value-comparison
    "PLW0603",  # global-statement
    "PLW2901",  # redefined-loop-name
    "RUF012",   # mutable-class-default
]

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 25
max-returns = 8
max-statements = 100
max-public-methods = 100

[tool.ruff.lint.per-file-ignores]
"scripts/*" = [
    "B007",     # unused-loop-control-variable
    "B018",     # useless-expression
    "B020",     # loop-variable-overrides-iterator
    "PLR0913",  # too-many-arguments
]
"tests/*" = [
    "B011",     # assert-false
    "RUF043",   # pytest-raises-ambiguous-pattern
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
